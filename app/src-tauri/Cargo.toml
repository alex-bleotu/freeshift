[package]
name = "freeshift-app"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "FreeShift - virtual shifting for MyWhoosh"

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
freeshift-core = { version = "0.1.0", path = "../../crates/freeshift-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.6", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2.5.5"
tokio = { version = "1.54.1", features = ["sync"] }
